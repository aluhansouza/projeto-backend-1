

version: '3.8'

services:

  mariadb:
    image: mariadb:12
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_USER: ${DB_USUARIO}
      MARIADB_PASSWORD: ${DB_SENHA}
      MARIADB_DATABASE: ${DB_NOME}
    volumes:
      - mariadb_data:/var/lib/mysql
    restart: unless-stopped


  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_USUARIO: ${DB_USUARIO}
      DB_SENHA: ${DB_SENHA}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - mariadb
    restart: unless-stopped

volumes:
  mariadb_data: